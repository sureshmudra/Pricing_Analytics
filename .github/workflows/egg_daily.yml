name: NECC Egg Price Daily
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Install dependencies
        run: pip install selenium pandas webdriver-manager lxml html5lib
      - name: Run extractor
        run: python necc_egg_price_extractor.py
      - name: Commit CSV to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/*.csv output/*.json || true
          git commit -m "Add egg price data ${{ github.run_id }}" || true
          git push || true
